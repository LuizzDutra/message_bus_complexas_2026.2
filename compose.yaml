# Sobe N instancias do servidor WebSocket + Redis Pub/Sub (barramento compartilhado).
# Cada instancia tem seu INSTANCE_ID; mensagens atravessam instancias via Redis.
# RabbitMQ ainda NAO esta integrado e so sobe com o profile "rabbitmq".
name: complexas

x-env: &app-env
  HOST: 0.0.0.0
  PORT: "8000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BUS_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  REDIS_CHANNEL: ${REDIS_CHANNEL:-complexas:ws}

x-app: &app
  build:
    context: .
  image: complexas:local
  restart: unless-stopped
  environment: *app-env
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s
  networks:
    - bus

services:
  instance-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: instance-1
    ports:
      - "8000:8000"

  instance-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: instance-2
    ports:
      - "8001:8000"

  instance-3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: instance-3
    ports:
      - "8002:8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bus

  # Comparativo futuro: ainda nao consumido pela aplicacao.
  #   docker compose --profile rabbitmq up --build
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: complexas
      RABBITMQ_DEFAULT_PASS: complexas
    ports:
      - "5672:5672"
      - "15672:15672" # console web (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bus

networks:
  bus:
    driver: bridge
